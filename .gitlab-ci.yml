workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID == $CI_PROJECT_ID && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop")'
    - when: never


stages:
  - build
  - lint
  - test


.docker-job:
  image: docker:29.6.0
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: ""


build-backend:
  stage: build
  extends: .docker-job

  rules:
    - changes:
      - app/backend/**/*
      - app/backend/Dockerfile

  script:
    - echo "Building backend..."
    - docker build -f app/backend/Dockerfile -t backend:latest .

build-frontend:
  stage: build
  extends: .docker-job

  rules:
    - changes:
      - app/frontend/**/*

  script:
    - echo "Building frontend..."
    - docker build -t frontend:latest app/frontend/


lint-backend:python:
  stage: lint
  allow_failure: true
  image: python:3.14.0-slim-trixie

  rules:
    - changes:
      - app/backend/**/*

  script:
    - echo "Installing ruff..."
    - python -m pip install ruff
    - echo "Linting..."
    - ruff check app/backend

lint-frontend:node:
  stage: lint
  allow_failure: true
  image: node:24-trixie-slim

  rules:
    - changes:
      - app/frontend/**/*

  script:
    - cd app/frontend/
    - echo "Linting..."
    - npm ci
    - npm run lint


test-backend:
  stage: test
  extends: .docker-job

  before_script:
    - apk add --no-cache docker-cli-compose
    - apk add --no-cache bash

  script:
    - ./install.sh
    - docker compose run --rm backend sh -c 'PYTHONPATH=app python -m pytest'
  
  after_script:
    - docker compose down -v
