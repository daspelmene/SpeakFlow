apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: speakflow-ingress
spec:
  ingressClassName: traefik
  rules:
  - http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000

      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000

      - path: /redoc
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000

      - path: /openapi.json
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000

      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
