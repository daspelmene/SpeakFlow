apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: docker.io/semyonnadutkin/speakflow-frontend:latest
        imagePullPolicy: Always

        resources:
          requests:
            memory: 32Mi
            cpu: 100m
          limits:
            memory: 512Mi
            cpu: 250m

        ports:
        - containerPort: 3000
      restartPolicy: Always
