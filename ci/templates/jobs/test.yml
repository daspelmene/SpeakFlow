test-backend:
  stage: test
  extends: .docker-job

  rules:
    - changes:
      - app/backend/**/*
      - app/backend/Dockerfile
      - app/tests/**/*

  before_script:
    - apk add --no-cache bash docker-cli-compose
    - bash ci/scripts/generate_env_data.sh
    - echo "DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY" >> /env/.env

  script:
    - docker compose -f ci/docker-compose.yml -p ci --env-file /env/.env up -d
    - sleep 15 # Wait for migrations to run
    - docker run --rm --network ci_default --env-file /env/.env "$DOCKERHUB_USER/speakflow-tests:${CI_COMMIT_SHA:-latest}"

  after_script:
    - docker compose -f ci/docker-compose.yml -p ci down -v
