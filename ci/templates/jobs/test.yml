test-backend:
  stage: test
  extends: .docker-job

  rules:
    - when: never

  before_script:
    - apk add --no-cache docker-cli-compose
    - apk add --no-cache bash

  script:
    - ./install.sh
    - docker compose run --rm backend sh -c 'cd /app && PYTHONPATH=/app python -m pytest'
  after_script:
    - docker compose down -v
